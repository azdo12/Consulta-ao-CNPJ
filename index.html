<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta CNPJ - Sistema de Busca</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 0.95em;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-pdf {
            background: #28a745;
            color: white;
            display: none;
        }

        .btn-pdf:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4);
        }

        .btn-pdf.visible {
            display: inline-block;
        }

        #resultado {
            margin-top: 30px;
            display: none;
        }

        #resultado.visible {
            display: block;
        }

        .resultado-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            border-left: 5px solid #667eea;
        }

        .resultado-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .resultado-item {
            background: white;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .resultado-item-label {
            font-weight: 600;
            color: #667eea;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .resultado-item-valor {
            color: #333;
            font-size: 1.1em;
            word-break: break-word;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .loading.visible {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }

        .error.visible {
            display: block;
        }

        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }

        .success.visible {
            display: block;
        }

        .help-text {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 15px;
            }

            .form-group {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Consulta CNPJ</h1>
            <p>Sistema de Busca de Informações de Pessoas Jurídicas</p>
        </header>

        <div class="content">
            <div class="form-section">
                <h2 style="margin-bottom: 20px; color: #333;">Busca por CNPJ</h2>
                
                <div class="form-group">
                    <div>
                        <label for="cnpj">CNPJ *</label>
                        <input type="text" id="cnpj" name="cnpj" placeholder="Ex: 00.000.000/0000-91" maxlength="18">
                        <div class="help-text">Digite o CNPJ com ou sem formatação</div>
                    </div>
                </div>

                <h3 style="margin-top: 25px; margin-bottom: 15px; color: #333; border-bottom: 2px solid #667eea; padding-bottom: 10px;">Filtros Avançados (Opcional)</h3>

                <div class="form-group">
                    <div>
                        <label for="razaoSocial">Razão Social</label>
                        <input type="text" id="razaoSocial" name="razaoSocial" placeholder="Nome empresarial">
                    </div>
                    <div>
                        <label for="nomeFantasia">Nome Fantasia</label>
                        <input type="text" id="nomeFantasia" name="nomeFantasia" placeholder="Nome fantasia">
                    </div>
                    <div>
                        <label for="atividadePrincipal">Atividade Principal</label>
                        <input type="text" id="atividadePrincipal" name="atividadePrincipal" placeholder="Ex: Comércio">
                    </div>
                </div>

                <div class="form-group">
                    <div>
                        <label for="capitalSocial">Capital Social</label>
                        <input type="text" id="capitalSocial" name="capitalSocial" placeholder="Ex: R$ 1.000.000,00">
                    </div>
                    <div>
                        <label for="endereco">Endereço</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro">
                    </div>
                    <div>
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX">
                    </div>
                </div>

                <div class="form-group">
                    <div>
                        <label for="situacaoCadastral">Situação Cadastral</label>
                        <select id="situacaoCadastral" name="situacaoCadastral">
                            <option value="">Todas</option>
                            <option value="ATIVA">Ativa</option>
                            <option value="INATIVA">Inativa</option>
                            <option value="INAPTA">Inapta</option>
                            <option value="BAIXADA">Baixada</option>
                        </select>
                    </div>
                    <div>
                        <label for="naturezaJuridica">Natureza Jurídica</label>
                        <input type="text" id="naturezaJuridica" name="naturezaJuridica" placeholder="Ex: Sociedade Limitada">
                    </div>
                    <div>
                        <label for="dataAbertura">Data de Abertura</label>
                        <input type="date" id="dataAbertura" name="dataAbertura">
                    </div>
                </div>

                <div class="form-group">
                    <div>
                        <label for="socio">Sócios/Administradores</label>
                        <input type="text" id="socio" name="socio" placeholder="Nome do sócio">
                    </div>
                    <div>
                        <label for="atividadesSecundarias">Atividades Secundárias</label>
                        <input type="text" id="atividadesSecundarias" name="atividadesSecundarias" placeholder="Ex: Consultoria">
                    </div>
                    <div>
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="contato@empresa.com">
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-primary" onclick="consultarCNPJ()">🔍 Consultar</button>
                    <button type="button" class="btn-pdf" id="pdfButton" onclick="gerarPDF()">📄 Exportar PDF</button>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 15px; color: #667eea; font-weight: 600;">Consultando CNPJ...</p>
            </div>

            <div class="error" id="erro"></div>
            <div class="success" id="sucesso"></div>

            <div id="resultado">
                <h2 style="color: #333; margin-bottom: 20px;">Resultado da Consulta</h2>
                <div class="resultado-container" id="resultadoContainer"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <script>
        // Formatar CNPJ
        function formatarCNPJ(cnpj) {
            cnpj = cnpj.replace(/\D/g, '');
            if (cnpj.length === 14) {
                return cnpj.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
            }
            return cnpj;
        }

        // Remover formatação
        function removerFormatacao(cnpj) {
            return cnpj.replace(/\D/g, '');
        }

        // Validar CNPJ
        function validarCNPJ(cnpj) {
            cnpj = removerFormatacao(cnpj);
            
            if (cnpj.length !== 14) {
                return false;
            }

            if (/^(\d)\1{13}$/.test(cnpj)) {
                return false;
            }

            let tamanho = cnpj.length - 2;
            let numeros = cnpj.substring(0, tamanho);
            let digitos = cnpj.substring(tamanho);
            let soma = 0;
            let pos = tamanho - 7;

            for (let i = tamanho; i >= 1; i--) {
                soma += numeros.charAt(tamanho - i) * pos--;
                if (pos < 2) {
                    pos = 9;
                }
            }

            let resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
            if (resultado !== parseInt(digitos.charAt(0))) {
                return false;
            }

            tamanho = tamanho - 1;
            numeros = cnpj.substring(0, tamanho);
            soma = 0;
            pos = tamanho - 7;

            for (let i = tamanho; i >= 1; i--) {
                soma += numeros.charAt(tamanho - i) * pos--;
                if (pos < 2) {
                    pos = 9;
                }
            }

            resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
            if (resultado !== parseInt(digitos.charAt(1))) {
                return false;
            }

            return true;
        }

        // Consultar CNPJ
        async function consultarCNPJ() {
            const cnpjInput = document.getElementById('cnpj').value.trim();
            const erro = document.getElementById('erro');
            const loading = document.getElementById('loading');

            // Limpar mensagens
            erro.classList.remove('visible');
            erro.innerHTML = '';

            // Validar CNPJ
            if (!cnpjInput) {
                erro.innerHTML = '❌ Por favor, digite um CNPJ.';
                erro.classList.add('visible');
                return;
            }

            if (!validarCNPJ(cnpjInput)) {
                erro.innerHTML = '❌ CNPJ inválido. Verifique o número digitado.';
                erro.classList.add('visible');
                return;
            }

            const cnpj = removerFormatacao(cnpjInput);
            loading.classList.add('visible');

            try {
                // Usar OpenCNPJ API
                const response = await fetch(`https://api.open-cnpj.org/${cnpj}`, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('CNPJ não encontrado na base de dados.');
                }

                const data = await response.json();
                exibirResultado(data);
                document.getElementById('pdfButton').classList.add('visible');

            } catch (error) {
                console.error('Erro:', error);
                erro.innerHTML = `❌ Erro ao consultar CNPJ: ${error.message}`;
                erro.classList.add('visible');
            } finally {
                loading.classList.remove('visible');
            }
        }

        // Exibir resultado
        function exibirResultado(data) {
            const resultado = document.getElementById('resultado');
            const container = document.getElementById('resultadoContainer');

            // Mapear dados da API para campos amigáveis
            const campos = {
                'CNPJ': formatarCNPJ(data.cnpj || ''),
                'Razão Social': data.razao_social || data.nome || 'N/A',
                'Nome Fantasia': data.nome_fantasia || 'N/A',
                'Situação Cadastral': data.situacao || 'N/A',
                'Data de Abertura': formatarData(data.data_abertura) || 'N/A',
                'Natureza Jurídica': data.natureza_juridica || 'N/A',
                'Capital Social': data.capital_social ? formatarMoeda(data.capital_social) : 'N/A',
                'Atividade Principal': data.atividade_principal?.[0]?.text || 'N/A',
                'CNAE': data.atividade_principal?.[0]?.code || 'N/A',
                'Endereço': formatarEndereco(data) || 'N/A',
                'Telefone': data.telefone || 'N/A',
                'E-mail': data.email || 'N/A',
                'CEP': data.cep || 'N/A',
                'Bairro': data.bairro || 'N/A',
                'Cidade': data.municipio || 'N/A',
                'Estado': data.uf || 'N/A',
                'Sócios': data.qsa?.[0]?.nome || 'N/A'
            };

            let html = '';
            for (const [chave, valor] of Object.entries(campos)) {
                if (valor && valor !== 'N/A') {
                    html += `
                        <div class="resultado-item">
                            <div class="resultado-item-label">${chave}</div>
                            <div class="resultado-item-valor">${valor}</div>
                        </div>
                    `;
                }
            }

            // Adicionar atividades secundárias se houver
            if (data.atividades_secundarias && data.atividades_secundarias.length > 0) {
                const atividades = data.atividades_secundarias.map(a => `${a.code} - ${a.text}`).join('<br>');
                html += `
                    <div class="resultado-item">
                        <div class="resultado-item-label">Atividades Secundárias</div>
                        <div class="resultado-item-valor">${atividades}</div>
                    </div>
                `;
            }

            // Adicionar sócios se houver
            if (data.qsa && data.qsa.length > 1) {
                const socios = data.qsa.map(s => s.nome).join('<br>');
                html += `
                    <div class="resultado-item">
                        <div class="resultado-item-label">Todos os Sócios</div>
                        <div class="resultado-item-valor">${socios}</div>
                    </div>
                `;
            }

            container.innerHTML = html;
            resultado.classList.add('visible');

            // Armazenar dados para PDF
            window.dadosCNPJ = data;
        }

        // Formatar data
        function formatarData(data) {
            if (!data) return null;
            const d = new Date(data);
            return d.toLocaleDateString('pt-BR');
        }

        // Formatar moeda
        function formatarMoeda(valor) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(valor);
        }

        // Formatar endereço
        function formatarEndereco(data) {
            const partes = [];
            if (data.logradouro) partes.push(data.logradouro);
            if (data.numero) partes.push(data.numero);
            if (data.complemento) partes.push(data.complemento);
            if (data.bairro) partes.push(data.bairro);
            if (data.municipio) partes.push(data.municipio);
            if (data.uf) partes.push(data.uf);
            if (data.cep) partes.push(data.cep);
            return partes.join(', ') || null;
        }

        // Gerar PDF
        function gerarPDF() {
            if (!window.dadosCNPJ) {
                alert('Nenhuma consulta para exportar!');
                return;
            }

            const elemento = document.getElementById('resultadoContainer');
            const opt = {
                margin: 10,
                filename: `CNPJ-${removerFormatacao(window.dadosCNPJ.cnpj)}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };

            // Criar conteúdo do PDF
            const conteudo = document.createElement('div');
            conteudo.innerHTML = `
                <h1 style="text-align: center; color: #667eea; margin-bottom: 20px;">
                    Relatório de CNPJ
                </h1>
                <div style="margin-bottom: 30px;">
                    ${elemento.innerHTML}
                </div>
                <hr style="margin: 30px 0;">
                <p style="text-align: center; color: #999; font-size: 12px;">
                    Gerado em: ${new Date().toLocaleString('pt-BR')}
                </p>
            `;

            html2pdf().set(opt).from(conteudo).save();
        }

        // Permitir Enter para buscar
        document.getElementById('cnpj').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                consultarCNPJ();
            }
        });

        // Auto-formatar CNPJ enquanto digita
        document.getElementById('cnpj').addEventListener('input', function(e) {
            let valor = e.target.value.replace(/\D/g, '');
            if (valor.length <= 14) {
                if (valor.length > 8) {
                    valor = valor.slice(0, 2) + '.' + valor.slice(2, 5) + '.' + 
                            valor.slice(5, 8) + '/' + valor.slice(8, 12) + '-' + valor.slice(12);
                } else if (valor.length > 5) {
                    valor = valor.slice(0, 2) + '.' + valor.slice(2, 5) + '.' + valor.slice(5);
                } else if (valor.length > 2) {
                    valor = valor.slice(0, 2) + '.' + valor.slice(2);
                }
                e.target.value = valor;
            }
        });
    </script>
</body>
</html>
